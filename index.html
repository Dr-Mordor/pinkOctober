<!doctype html>
<html lang="ar" dir="rtl">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title> اكتوبر الوردي </title>
	<meta 
		name="description"
		content="دليل رقمي يساعد النساء في نابلس على الوصول إلى خدمات الكشف والتصوير والتشخيص والعلاج والدعم النفسي والاجتماعي والرعاية التلطيفية والمنزلية الخاصة بسرطان الثدي."
	/>
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link
		href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap"
		rel="stylesheet"
	/>
	<link rel="stylesheet" href="css/tokens.css" />
	<link rel="stylesheet" href="css/base.css" />
	<link rel="stylesheet" href="css/layout.css" />
	<link rel="stylesheet" href="css/buttons.css" />
	<link rel="stylesheet" href="css/journey.css" />
	<link rel="stylesheet" href="css/directory.css" />
	<link rel="stylesheet" href="css/motion.css" />
</head>
<body>
	<div class="app" id="app">
		<header class="app-bar">
			<button type="button" class="back-btn" id="backBtn" hidden>
				رجوع
			</button>
			<span class="app-bar-title" id="appBarTitle">أكتوبر الوردي · نابلس</span>
		</header>

		<main class="app-views">
			<section class="view view-home" id="viewHome">
				<div class="container">
					<p class="eyebrow">حملة أكتوبر الوردي 2026 · نابلس</p>
					<h1>أين أنتِ الآن في رحلتك؟</h1>
					<p class="lead">اختاري الوصف الأقرب لحالتك لعرض الجهات والخدمات المناسبة لكِ.</p>
					<div class="journey-grid" id="journeyGrid" role="list"></div>
				</div>
			</section>

			<section class="view view-results" id="viewResults" hidden>
				<div class="container">
					<div class="results-heading" id="resultsHeading"></div>
					<div id="directoryList" class="directory-list" role="list"></div>
					<button type="button" class="btn browse-other" id="browseOtherBtn">
						اختيار مسار آخر
					</button>
				</div>
			</section>
		</main>
	</div>

	<script type="module" src="script.js"></script>
</body>
</html>
