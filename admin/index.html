<!doctype html>
<html lang="ar" dir="rtl">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<meta name="robots" content="noindex, nofollow" />
	<title>لوحة الإدارة · أكتوبر الوردي</title>
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link
		href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap"
		rel="stylesheet"
	/>
	<link rel="stylesheet" href="../css/tokens.css" />
	<link rel="stylesheet" href="../css/base.css" />
	<link rel="stylesheet" href="../css/layout.css" />
	<link rel="stylesheet" href="../css/buttons.css" />
	<link rel="stylesheet" href="../css/admin.css" />
</head>
<body>
	<div class="app">
		<header class="app-bar">
			<span class="app-bar-title">لوحة الإدارة · أكتوبر الوردي</span>
			<nav class="admin-tabs" id="adminTabs" hidden>
				<button type="button" class="admin-tab" data-tab="institutions" aria-selected="true">الجهات</button>
				<button type="button" class="admin-tab" data-tab="analytics" aria-selected="false">الإحصائيات</button>
			</nav>
			<button type="button" class="btn btn-quiet admin-logout" id="logoutBtn" hidden>تسجيل الخروج</button>
		</header>

		<main class="app-views">
			<section class="view" id="viewLogin" hidden>
				<div class="container admin-narrow">
					<h1>تسجيل الدخول</h1>
					<form id="loginForm" class="admin-form">
						<label>البريد الإلكتروني
							<input type="email" name="email" autocomplete="username" required />
						</label>
						<label>كلمة المرور
							<input type="password" name="password" autocomplete="current-password" required />
						</label>
						<p class="admin-error" id="loginError" role="alert" hidden></p>
						<button type="submit" class="btn">دخول</button>
					</form>
				</div>
			</section>

			<section class="view" id="viewDenied" hidden>
				<div class="container admin-narrow">
					<h1>لا تملك صلاحية الدخول</h1>
					<p class="lead">هذا الحساب غير مضاف إلى قائمة المدراء. اطلب من المسؤول إضافة بريدك.</p>
				</div>
			</section>

			<section class="view" id="viewInstitutions" hidden>
				<div class="container">
					<div class="admin-toolbar">
						<h1>الجهات والمرافق</h1>
						<button type="button" class="btn" id="addInstitutionBtn">إضافة جهة</button>
					</div>
					<p class="admin-error" id="listError" role="alert" hidden></p>
					<div class="admin-table-wrap">
						<table class="admin-table">
							<thead>
								<tr>
									<th>الاسم</th>
									<th>النوع</th>
									<th>المسارات</th>
									<th>الحالة</th>
									<th></th>
								</tr>
							</thead>
							<tbody id="institutionRows"></tbody>
						</table>
					</div>
				</div>
			</section>

			<section class="view" id="viewAnalytics" hidden>
				<div class="container">
					<div class="admin-toolbar">
						<h1>الإحصائيات</h1>
						<label class="admin-inline">الفترة
							<select id="rangeSelect">
								<option value="7">آخر 7 أيام</option>
								<option value="30" selected>آخر 30 يومًا</option>
								<option value="90">آخر 90 يومًا</option>
							</select>
						</label>
					</div>
					<p class="admin-error" id="analyticsError" role="alert" hidden></p>
					<div id="analyticsBody"></div>
				</div>
			</section>
		</main>
	</div>

	<dialog id="institutionDialog" class="admin-dialog">
		<form id="institutionForm" class="admin-form" method="dialog">
			<h2 id="dialogTitle"></h2>
			<div id="institutionFields"></div>
			<p class="admin-error" id="formError" role="alert" hidden></p>
			<div class="admin-actions">
				<button type="submit" class="btn" id="saveBtn">حفظ</button>
				<button type="button" class="btn btn-quiet" id="cancelBtn">إلغاء</button>
			</div>
		</form>
	</dialog>

	<script type="module" src="../js/admin/app.js"></script>
</body>
</html>
